name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: swift --version
      - run: swift build
      - run: scripts/test.sh --no-parallel
      - run: scripts/bundle.sh
